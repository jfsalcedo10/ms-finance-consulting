<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Page not found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=4" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner container">
      <a href="/" class="brand">
        <img src="/assets/logo.svg?v=2" alt="M&amp;S Finance Consulting" width="36" height="38" />
        <span class="brand-name">
          <span class="brand-mark"><span class="brand-m">M</span><span class="brand-amp">&amp;</span><span class="brand-s">S</span></span>
        </span>
      </a>
    </div>
  </header>

  <main>
    <section class="page-header" data-mark="404">
      <div class="container">
        <span class="eyebrow">404</span>
        <h1>{{ es.notFound.title }}</h1>
        <p class="subtitle">{{ es.notFound.body }}</p>
        <a href="/" class="btn btn-primary">{{ es.notFound.home }}</a>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <span class="eyebrow">404</span>
        <h1>{{ en.notFound.title }}</h1>
        <p class="subtitle">{{ en.notFound.body }}</p>
        <a href="/en/" class="btn btn-primary">{{ en.notFound.home }}</a>
      </div>
    </section>
  </main>
</body>
</html>
