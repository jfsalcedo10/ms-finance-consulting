<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Page not found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css?v=7" />
</head>
<body class="notfound">
  <header class="site-header">
    <div class="header-inner container">
      <a href="/" class="brand">
        <img src="/assets/logo.svg?v=2" alt="M&amp;S Finance Consulting" width="36" height="38" />
        <span class="brand-name">
          <span class="brand-mark"><span class="brand-m">M</span><span class="brand-amp">&amp;</span><span class="brand-s">S</span></span>
          <span class="brand-tail">Finance Consulting</span>
        </span>
      </a>
    </div>
  </header>

  <main>
    <!-- One block serving both languages, and a single CTA. The English
         fragments carry lang="en" so a screen reader doesn't read them with
         Spanish pronunciation (WCAG 3.1.2) — the copy is mixed-language even
         though the document is declared Spanish. -->
    <section class="page-header" data-mark="404">
      <div class="container">
        <span class="eyebrow">404</span>
        <h1>Página no encontrada / <span lang="en">Page not found</span></h1>
        <p class="subtitle">La página que buscas no existe o cambió de dirección. / <span lang="en">The page you are looking for does not exist or has moved.</span></p>
        <a href="/" class="btn btn-primary">Ir al inicio / <span lang="en">Go to the homepage</span></a>
      </div>
    </section>
  </main>
</body>
</html>
